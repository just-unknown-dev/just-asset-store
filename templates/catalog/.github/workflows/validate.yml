# Every pull request: the catalog must build, each archive it points to must
# download, match its pinned SHA-256 and pass the installer's own checks, and
# CODEOWNERS must match the publishers.
name: Validate

on:
  pull_request:

permissions:
  contents: read

env:
  # The store tool, at a version that never moves under this workflow.
  STORE_VERSION: 0.1.0

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      - name: Install the store tool
        run: dart pub global activate just_asset_store "$STORE_VERSION"

      - name: The catalog builds
        run: dart pub global run just_asset_store:just_plugin store index check .

      # Branch and folder names reach the shell as values, never as script
      # text; one folder name per line, whatever it holds.
      - name: Changed items download and install cleanly
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git diff --name-only "origin/$BASE...HEAD" -- items \
            | cut -d/ -f2 | sort -u \
            | while IFS= read -r id; do
                if [ -d "items/$id" ]; then
                  dart pub global run just_asset_store:just_plugin \
                    store index check . --download --only "$id"
                fi
              done

      - name: CODEOWNERS is up to date
        run: |
          dart pub global run just_asset_store:just_plugin \
            store index codeowners . --file "$RUNNER_TEMP/CODEOWNERS"
          diff -u .github/CODEOWNERS "$RUNNER_TEMP/CODEOWNERS"
