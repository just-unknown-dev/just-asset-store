# Every merge to main: build index.json and the pictures beside it, and
# publish them on GitHub Pages — the address the editor's store reads.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - name: Install the store tool
        run: |
          dart pub global activate just_core_cli
          dart pub global activate --source git https://github.com/just-unknown-dev/just-asset-store

      - name: Build the catalog
        run: just store index build . -o site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
