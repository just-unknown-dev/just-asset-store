# Push a tag like v1.2.0: pack the package into its archive and attach it to
# a GitHub Release, with the catalog's version file and just_release.json —
# the file every release carries under the same name, which the store's
# refresh finds and `just add https://github.com/<owner>/<repo>` reads.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - name: Install the store tool
        run: |
          dart pub global activate just_core_cli
          dart pub global activate --source git https://github.com/just-unknown-dev/just-asset-store

      - name: The tag matches the version
        run: |
          version=$(grep -E '^version:' pubspec.yaml | tr -d '\r' | awk '{print $2}')
          test "v$version" = "${{ github.ref_name }}" \
            || { echo "Tag ${{ github.ref_name }} but pubspec says $version"; exit 1; }

      - name: Pack
        run: |
          just store pack . -o dist --tag "${{ github.ref_name }}" \
            --url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --notes-file CHANGELOG.md
